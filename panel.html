<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel administrativo | Impulso UAEMéx</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dashboard-body">
    <header class="navbar">
        <div class="nav-logo">
            <img src="img/logo-uaemex.png" class="logo" alt="Logo UAEMéx">
            <div class="logo-texto">
                <h3>IMPULSO UAEMÉX</h3>
                <span>Panel administrativo</span>
            </div>
        </div>
    </header>

    <main class="dashboard">
        <section class="resumen-pass">
            <div>
                <span class="etiqueta">ADMINISTRADOR</span>
                <h2>Generador de 49 QR</h2>
                <p>Se crearán las siete actividades de cada uno de los siete escenarios.</p>
            </div>
            <div style="display:flex; gap:12px; flex-wrap:wrap;">
                <button id="generarQR" class="btn-registro" type="button">Generar QR</button>
                <button id="descargarPDF" class="btn-registro" type="button" style="background:#0F766E;">Descargar PDF</button>
            </div>
        </section>
        <section id="contenedorQR" class="grid-qr"></section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/panel.js"></script>
</body>
</html>

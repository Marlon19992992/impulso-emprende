<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administrador QR</title>

<link rel="stylesheet" href="css/styles.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body class="dashboard-body">

<header class="navbar">

    <div class="nav-logo">
        <img src="img/logo-uaemex.png" class="logo">
        <div class="logo-texto">
            <h3>Administrador</h3>
            <span>Generador de QR</span>
        </div>
    </div>

</header>

<main class="dashboard">

    <section class="resumen-pass">

        <div>
            <span class="etiqueta">PANEL ADMINISTRATIVO</span>
            <h2>42 códigos QR del Festival</h2>
            <p>Cada QR pertenece a una actividad específica.</p>
        </div>

        <button class="btn-registro" onclick="window.print()">
            Imprimir PDF
        </button>

    </section>

    <section class="grid-qr" id="contenedorQR"></section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/admin.js"></script>

</body>
</html>

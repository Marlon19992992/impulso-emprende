<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador | Impulso Emprende 2026</title>

    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<div class="background"></div>

<header class="top-nav">
    <div class="nav-brand">
        <img src="img/logo-uaemex.png" class="nav-logo" alt="UAEMéx">
        <div>
            <h3>IMPULSO EMPRENDE 2026</h3>
            <p>Panel de Administración</p>
        </div>
    </div>
</header>
//Es es el nombre del evento
<main class="admin-page">

    <section class="admin-card">

        <div class="admin-header">
            <div class="admin-icon">🛡️</div>
            <p>ACCESO RESTRINGIDO</p>
            <h1>Administrador</h1>
            <span>
                Solo personal autorizado del festival puede ingresar al panel de control.
            </span>
        </div>

        <form id="loginAdmin" class="admin-form">

            <label for="usuario">Usuario</label>
            <input
                id="usuario"
                type="text"
                placeholder="Administrador"
                required
            >

            <label for="password">Contraseña</label>
            <input
                id="password"
                type="password"
                placeholder="••••••••"
                required
            >

            <button type="submit" class="admin-btn">
                Iniciar Sesión
            </button>

            <button
                type="button"
                class="volver-btn"
                onclick="window.location.href='index.html'">
                ← Volver al Registro
            </button>

        </form>

        <p id="mensaje" class="error-admin"></p>

    </section>

</main>

<script src="js/admin.js"></script>

</body>
</html>

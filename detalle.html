<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tierra Temática</title>

<link rel="stylesheet" href="css/styles.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body class="dashboard-body">

<header class="topbar">

<div class="usuario">
    <img src="img/logo-uaemex.png" class="logo">
    <div>
        <span id="tipoTierra">TIERRA</span>
        <h2 id="nombreTierra">Tecnología</h2>
    </div>
</div>

<button class="volver" onclick="history.back()">
← Regresar
</button>

</header>

<main class="dashboard">

<section class="hero">

<h1 id="tituloTierra">Tecnología</h1>

<p id="descripcionTierra">
Explora las actividades disponibles de esta Tierra.
</p>

</section>

<section>

<h2>Actividades del día</h2>

<div id="listaActividades"></div>

</section>

<section class="insignias">

<h2>Evidencias del Escenario</h2>

<p>
Después de escanear el QR de una actividad deberás tomar
dos fotografías del escenario para obtener tu insignia.
</p>

<div class="grid-insignias">

<div class="badge">📸 Fotografía 1</div>
<div class="badge">📸 Fotografía 2</div>

</div>

</section>

</main>

<script src="js/detalle.js"></script>

</body>
</html>
